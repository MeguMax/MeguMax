<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">MiFILE document workflow</title><desc id="desc">Simplified workflow from email and document intake to separate case groups, extraction, protected operator review, immutable snapshots and unsubmitted external bundles. Readback verifies preparation; uncertain outcomes require reconciliation. A separate Excel add-in produces editable PDFs.</desc><defs><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#9aabba"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a86912"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#3468a8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#556779}.lane{font-size:16px;font-weight:700;letter-spacing:1.4px;fill:#556779}.card-title{font-size:20px;font-weight:700}.body{font-size:17px;fill:#556779}.edge{font-size:16px;fill:#556779;paint-order:stroke;stroke:#f6f6f1;stroke-width:7px;stroke-linejoin:round}.note{font-size:16px;fill:#556779}.small-title{font-size:18px;font-weight:700}</style><rect width="1400" height="850" fill="#f6f6f1"/><text x="40" y="54" class="title"><tspan x="40" dy="0">MiFILE document workflow</tspan></text><text x="40" y="85" class="subtitle"><tspan x="40" dy="0">Case-scoped intake, protected review decisions and verified preparation.</tspan></text><path d="M40 140H1360" stroke="#d9dfe2"/><text x="40" y="125" class="lane"><tspan x="40" dy="0">01  INTAKE AND REVIEW</tspan></text><g><rect x="40" y="175" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 176H325" stroke="#3468a8" stroke-width="3"/><text x="60" y="208" class="card-title"><tspan x="60" dy="0">Outlook + PDFs</tspan></text><text x="60" y="237" class="body"><tspan x="60" dy="0">Incoming email</tspan><tspan x="60" dy="24">Attachments and source files</tspan></text></g><g><rect x="380" y="175" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M395 176H665" stroke="#3468a8" stroke-width="3"/><text x="400" y="208" class="card-title"><tspan x="400" dy="0">Microsoft Graph intake</tspan></text><text x="400" y="237" class="body"><tspan x="400" dy="0">Discover and store sources</tspan><tspan x="400" dy="24">OneDrive document storage</tspan></text></g><g><rect x="720" y="175" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 176H1005" stroke="#087f83" stroke-width="3"/><text x="740" y="208" class="card-title"><tspan x="740" dy="0">Grouping + extraction</tspan></text><text x="740" y="237" class="body"><tspan x="740" dy="0">Independent case groups</tspan><tspan x="740" dy="24">PDF fields, text and OCR</tspan><tspan x="740" dy="24">Ambiguity stays visible</tspan></text></g><g><rect x="1060" y="175" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 176H1345" stroke="#a86912" stroke-width="3"/><text x="1080" y="208" class="card-title"><tspan x="1080" dy="0">Operator review</tspan></text><text x="1080" y="237" class="body"><tspan x="1080" dy="0">Protected manual corrections</tspan><tspan x="1080" dy="24">SQLite WAL state</tspan><tspan x="1080" dy="24">Versions and audit history</tspan></text></g><path d="M340 241H380" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M680 241H720" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1020 241H1060" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M40 350H1360" stroke="#d9dfe2"/><text x="40" y="335" class="lane"><tspan x="40" dy="0">02  PREPARE, THEN REOPEN AND VERIFY</tspan></text><g><rect x="1060" y="390" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 391H1345" stroke="#087f83" stroke-width="3"/><text x="1080" y="423" class="card-title"><tspan x="1080" dy="0">Versioned snapshot</tspan></text><text x="1080" y="452" class="body"><tspan x="1080" dy="0">Validated reviewed package</tspan><tspan x="1080" dy="24">Immutable worker input</tspan></text></g><g><rect x="720" y="390" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 391H1005" stroke="#087f83" stroke-width="3"/><text x="740" y="423" class="card-title"><tspan x="740" dy="0">Preparation worker</tspan></text><text x="740" y="452" class="body"><tspan x="740" dy="0">Checkpoints and retries</tspan><tspan x="740" dy="24">Browser automation</tspan></text></g><g><rect x="380" y="390" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M395 391H665" stroke="#3468a8" stroke-width="3"/><text x="400" y="423" class="card-title"><tspan x="400" dy="0">Unsubmitted bundle</tspan></text><text x="400" y="452" class="body"><tspan x="400" dy="0">External preparation only</tspan><tspan x="400" dy="24">No payment or court filing</tspan></text></g><g><rect x="40" y="390" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 391H325" stroke="#087f83" stroke-width="3"/><text x="60" y="423" class="card-title"><tspan x="60" dy="0">Readback verification</tspan></text><text x="60" y="452" class="body"><tspan x="60" dy="0">Reopen saved output</tspan><tspan x="60" dy="24">Check the expected package</tspan></text></g><path d="M1210 307V390" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1060 456H1020" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M720 456H680" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M380 456H340" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M40 595H1360" stroke="#d9dfe2"/><text x="40" y="580" class="lane"><tspan x="40" dy="0">03  RECOVERY AND COMPANION TOOLS</tspan></text><g><rect x="40" y="630" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 631H325" stroke="#087f83" stroke-width="3"/><text x="60" y="663" class="card-title"><tspan x="60" dy="0">Notification outbox</tspan></text><text x="60" y="692" class="body"><tspan x="60" dy="0">Only after verified</tspan><tspan x="60" dy="24">package preparation</tspan></text></g><g><rect x="380" y="630" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M395 631H665" stroke="#a86912" stroke-width="3"/><text x="400" y="663" class="card-title"><tspan x="400" dy="0">Reconciliation</tspan></text><text x="400" y="692" class="body"><tspan x="400" dy="0">Investigate uncertain writes</tspan><tspan x="400" dy="24">or readback mismatches</tspan></text></g><g><rect x="720" y="630" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 631H1005" stroke="#3468a8" stroke-width="3"/><text x="740" y="663" class="card-title"><tspan x="740" dy="0">Excel + Office.js</tspan></text><text x="740" y="692" class="body"><tspan x="740" dy="0">Selected, calculated rows</tspan><tspan x="740" dy="24">Selection and value checks</tspan></text></g><g><rect x="1060" y="630" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 631H1345" stroke="#087f83" stroke-width="3"/><text x="1080" y="663" class="card-title"><tspan x="1080" dy="0">Fillable PDF worker</tspan></text><text x="1080" y="692" class="body"><tspan x="1080" dy="0">Python form generation</tspan><tspan x="1080" dy="24">Validated preview + download</tspan></text></g><path d="M190 522V630" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><text x="65" y="562" class="edge"><tspan x="65" dy="0">Verified</tspan></text><path d="M870 522V555H530V630" fill="none" stroke="#a86912" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="720" y="548" class="edge"><tspan x="720" dy="0">Uncertain write</tspan></text><path d="M340 477H355V562H470V630" fill="none" stroke="#a86912" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="360" y="554" class="edge"><tspan x="360" dy="0">Mismatch</tspan></text><path d="M1020 696H1060" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><text x="40" y="810" class="note"><tspan x="40" dy="0">Preparation stops at Unsubmitted. Payment and final court filing are outside the verified result.</tspan></text></svg>