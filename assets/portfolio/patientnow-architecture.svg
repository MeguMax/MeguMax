<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">PatientNow ↔ GoHighLevel synchronization</title><desc id="desc">Simplified implementation architecture: provider events are authenticated by a Fastify receiver, enqueued into SQS FIFO and handled by a single writer worker. DynamoDB records leases and receipts, EFS stores identity links and checkpoints, failures enter a dead-letter queue and reconciliation jobs reuse domain locks.</desc><defs><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#9aabba"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a86912"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#3468a8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#556779}.lane{font-size:16px;font-weight:700;letter-spacing:1.4px;fill:#556779}.card-title{font-size:20px;font-weight:700}.body{font-size:17px;fill:#556779}.edge{font-size:16px;fill:#556779;paint-order:stroke;stroke:#f6f6f1;stroke-width:7px;stroke-linejoin:round}.note{font-size:16px;fill:#556779}.small-title{font-size:18px;font-weight:700}</style><rect width="1400" height="850" fill="#f6f6f1"/><text x="40" y="54" class="title"><tspan x="40" dy="0">PatientNow ↔ GoHighLevel synchronization</tspan></text><text x="40" y="85" class="subtitle"><tspan x="40" dy="0">Ordered event processing with persistent identity links and explicit recovery.</tspan></text><path d="M40 140H1360" stroke="#d9dfe2"/><text x="40" y="125" class="lane"><tspan x="40" dy="0">01  RECEIVE AND PROCESS EVENTS</tspan></text><g><rect x="40" y="240" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 241H325" stroke="#3468a8" stroke-width="3"/><text x="60" y="273" class="card-title"><tspan x="60" dy="0">PatientNow + GoHighLevel</tspan></text><text x="60" y="302" class="body"><tspan x="60" dy="0">Contacts and appointments</tspan><tspan x="60" dy="24">Provider / workflow events</tspan></text></g><g><rect x="380" y="240" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M395 241H665" stroke="#087f83" stroke-width="3"/><text x="400" y="273" class="card-title"><tspan x="400" dy="0">Fastify webhook receiver</tspan></text><text x="400" y="302" class="body"><tspan x="400" dy="0">Authenticate and validate</tspan><tspan x="400" dy="24">Normalize, then enqueue</tspan><tspan x="400" dy="24">202 only after enqueue</tspan></text></g><g><rect x="720" y="240" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 241H1005" stroke="#087f83" stroke-width="3"/><text x="740" y="273" class="card-title"><tspan x="740" dy="0">SQS FIFO</tspan></text><text x="740" y="302" class="body"><tspan x="740" dy="0">Tenant / entity streams</tspan><tspan x="740" dy="24">Ordered event delivery</tspan></text></g><g><rect x="1060" y="240" width="300" height="132" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 241H1345" stroke="#087f83" stroke-width="3"/><text x="1080" y="273" class="card-title"><tspan x="1080" dy="0">Single writer worker</tspan></text><text x="1080" y="302" class="body"><tspan x="1080" dy="0">Identity and sync rules</tspan><tspan x="1080" dy="24">Echo and stale-event guards</tspan></text></g><path d="M340 306H380" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M680 306H720" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1020 306H1060" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1210 240V177H190V240" fill="none" stroke="#3468a8" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="550" y="167" class="edge"><tspan x="550" dy="0">Contact and appointment writes</tspan></text><path d="M40 455H1360" stroke="#d9dfe2"/><text x="40" y="440" class="lane"><tspan x="40" dy="0">02  PERSIST PROGRESS AND RECOVER</tspan></text><g><rect x="40" y="520" width="640" height="180" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 521H665" stroke="#a86912" stroke-width="3"/><text x="60" y="553" class="card-title"><tspan x="60" dy="0">Reconciliation jobs</tspan></text><text x="60" y="582" class="body"><tspan x="60" dy="0">Catch missed events and pagination gaps</tspan><tspan x="60" dy="24">Use the same domain locks and conflict checks</tspan><tspan x="60" dy="24">Revisit incomplete synchronization progress</tspan></text></g><g><rect x="720" y="520" width="300" height="180" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 521H1005" stroke="#a86912" stroke-width="3"/><text x="740" y="553" class="card-title"><tspan x="740" dy="0">Dead-letter queue</tspan></text><text x="740" y="582" class="body"><tspan x="740" dy="0">Exhausted retries</tspan><tspan x="740" dy="24">Failures stay available</tspan><tspan x="740" dy="24">for investigation</tspan></text></g><g><rect x="1060" y="520" width="300" height="180" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 521H1345" stroke="#087f83" stroke-width="3"/><text x="1080" y="553" class="card-title"><tspan x="1080" dy="0">Durable processing state</tspan></text><text x="1080" y="582" class="body"><tspan x="1080" dy="0">DynamoDB: leases + receipts</tspan><tspan x="1080" dy="24">EFS: links + checkpoints</tspan><tspan x="1080" dy="24">Persist identity and progress</tspan></text></g><path d="M870 372V520" fill="none" stroke="#a86912" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="734" y="480" class="edge"><tspan x="734" dy="0">Redrive after failures</tspan></text><path d="M1210 372V520" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><text x="1130" y="480" class="edge"><tspan x="1130" dy="0">Claim and persist</tspan></text><path d="M360 700V745H1380V306H1360" fill="none" stroke="#a86912" stroke-width="2" marker-end="url(#arrow-amber)" stroke-dasharray="6 5"/><text x="815" y="736" class="edge"><tspan x="815" dy="0">Reuse domain locks</tspan></text><text x="40" y="810" class="note"><tspan x="40" dy="0">Implementation schematic: API, queue and worker are separate responsibilities; live route validation is recorded separately.</tspan></text></svg>