<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="795" viewBox="0 0 1400 795" role="img" aria-labelledby="title desc"><title id="title">Upwork workflow platform</title><desc id="desc">Architecture from OAuth connections and provider reads through normalized job facts, PostgreSQL, pinned preparation stages, AI validation and operator review. Delivery is an approval-gated branch.</desc><defs><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#9aabba"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a86912"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#3468a8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#556779}.lane{font-size:16px;font-weight:700;letter-spacing:1.4px;fill:#556779}.card-title{font-size:20px;font-weight:700}.body{font-size:17px;fill:#556779}.edge{font-size:16px;fill:#556779;paint-order:stroke;stroke:#f6f6f1;stroke-width:7px;stroke-linejoin:round}.note{font-size:16px;fill:#556779}.small-title{font-size:18px;font-weight:700}</style><rect width="1400" height="795" fill="#f6f6f1"/><text x="40" y="54" class="title"><tspan x="40" dy="0">Upwork workflow platform</tspan></text><text x="40" y="85" class="subtitle"><tspan x="40" dy="0">Connected accounts, reproducible preparation and explicit operator approval.</tspan></text><path d="M40 140H1360" stroke="#d9dfe2"/><text x="40" y="125" class="lane"><tspan x="40" dy="0">01  CONNECT AND NORMALIZE</tspan></text><g><rect x="40" y="175" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 176H325" stroke="#3468a8" stroke-width="3"/><text x="60" y="208" class="card-title"><tspan x="60" dy="0">OAuth connections</tspan></text><text x="60" y="237" class="body"><tspan x="60" dy="0">PKCE and encrypted tokens</tspan><tspan x="60" dy="24">Coordinated token refresh</tspan></text></g><g><rect x="380" y="175" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M395 176H665" stroke="#3468a8" stroke-width="3"/><text x="400" y="208" class="card-title"><tspan x="400" dy="0">Upwork integration</tspan></text><text x="400" y="237" class="body"><tspan x="400" dy="0">Official MCP / API adapters</tspan><tspan x="400" dy="24">Account-scoped reads</tspan></text></g><g><rect x="720" y="175" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 176H1005" stroke="#087f83" stroke-width="3"/><text x="740" y="208" class="card-title"><tspan x="740" dy="0">Job intake</tspan></text><text x="740" y="237" class="body"><tspan x="740" dy="0">Canonical identity</tspan><tspan x="740" dy="24">Full details + partial updates</tspan></text></g><g><rect x="1060" y="175" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 176H1345" stroke="#087f83" stroke-width="3"/><text x="1080" y="208" class="card-title"><tspan x="1080" dy="0">PostgreSQL state</tspan></text><text x="1080" y="237" class="body"><tspan x="1080" dy="0">Transactions and revisions</tspan><tspan x="1080" dy="24">Persisted workflow history</tspan></text></g><path d="M340 231H380" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M680 231H720" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1020 231H1060" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M40 355H1360" stroke="#d9dfe2"/><text x="40" y="340" class="lane"><tspan x="40" dy="0">02  PREPARE WITH PINNED SOURCES</tspan></text><g><rect x="40" y="390" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 391H325" stroke="#087f83" stroke-width="3"/><text x="60" y="423" class="card-title"><tspan x="60" dy="0">Versioned evidence</tspan></text><text x="60" y="452" class="body"><tspan x="60" dy="0">Profiles and portfolio cases</tspan><tspan x="60" dy="24">Writing rules and source IDs</tspan></text></g><g><rect x="380" y="390" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M395 391H665" stroke="#087f83" stroke-width="3"/><text x="400" y="423" class="card-title"><tspan x="400" dy="0">Preparation worker</tspan></text><text x="400" y="452" class="body"><tspan x="400" dy="0">Claimed, ordered stages</tspan><tspan x="400" dy="24">Pinned input and policy hashes</tspan></text></g><g><rect x="720" y="390" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M735 391H1005" stroke="#087f83" stroke-width="3"/><text x="740" y="423" class="card-title"><tspan x="740" dy="0">AI preparation</tspan></text><text x="740" y="452" class="body"><tspan x="740" dy="0">Responses API</tspan><tspan x="740" dy="24">Source and domain validation</tspan></text></g><g><rect x="1060" y="390" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 391H1345" stroke="#a86912" stroke-width="3"/><text x="1080" y="423" class="card-title"><tspan x="1080" dy="0">Reviewed package</tspan></text><text x="1080" y="452" class="body"><tspan x="1080" dy="0">Original output + corrections</tspan><tspan x="1080" dy="24">Explicit approval required</tspan></text></g><path d="M340 446H380" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M680 446H720" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1020 446H1060" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><path d="M1210 287V318H530V390" fill="none" stroke="#9aabba" stroke-width="2" marker-end="url(#arrow-line)"/><text x="730" y="314" class="edge"><tspan x="730" dy="0">Queued run snapshots</tspan></text><path d="M40 570H1360" stroke="#d9dfe2"/><text x="40" y="555" class="lane"><tspan x="40" dy="0">03  REVIEW AND CONTROL SIDE EFFECTS</tspan></text><g><rect x="40" y="605" width="640" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M55 606H665" stroke="#a86912" stroke-width="3"/><text x="60" y="638" class="card-title"><tspan x="60" dy="0">Operator workspace + Express API</tspan></text><text x="60" y="667" class="body"><tspan x="60" dy="0">Read, review and edit current workflow state</tspan><tspan x="60" dy="24">Preserve manual text; reject stale asynchronous responses</tspan></text></g><g><rect x="1060" y="605" width="300" height="112" rx="14" fill="white" stroke="#cbd4db"/><path d="M1075 606H1345" stroke="#a86912" stroke-width="3"/><text x="1080" y="638" class="card-title"><tspan x="1080" dy="0">Guarded delivery</tspan></text><text x="1080" y="667" class="body"><tspan x="1080" dy="0">Immutable approved package</tspan><tspan x="1080" dy="24">Preview · lock · reconciliation</tspan></text></g><path d="M1210 502V605" fill="none" stroke="#a86912" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="1230" y="557" class="edge"><tspan x="1230" dy="0">Approved package</tspan></text><text x="720" y="639" class="body"><tspan x="720" dy="0">Receipt, verified result or</tspan><tspan x="720" dy="24">unknown outcome retained</tspan><tspan x="720" dy="24">as distinct workflow states.</tspan></text><text x="40" y="760" class="note"><tspan x="40" dy="0">Simplified component flow. Delivery capabilities remain account-scoped and approval-gated.</tspan></text></svg>